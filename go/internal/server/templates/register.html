{{define "content"}}
<div class="login-card">
  <h1>Create your account</h1>
  <form method="post" action="/register" class="stacked">
    <div class="field">
      <label>I want to…</label>
      <div class="role-choice-row">
        <label class="role-choice">
          <input type="radio" name="role" value="client" checked>
          Hire freelancers
        </label>
        <label class="role-choice">
          <input type="radio" name="role" value="freelancer">
          Find work
        </label>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" name="firstName" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" name="lastName" autocomplete="family-name" required>
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
    </div>
    <label class="checkbox-row">
      <input type="checkbox" name="agreedToTerms">
      <span>I agree to the Terms of Service and Privacy Policy.</span>
    </label>
    <button type="submit" class="button">Create account</button>
  </form>
  <p class="muted center-note">Already have an account? <a href="/login">Sign in</a>.</p>
</div>
{{end}}
