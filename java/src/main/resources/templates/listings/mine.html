<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My listings — Marketplace</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
  <div class="page-heading page-heading-row">
    <div>
      <h1 class="page-title">My listings</h1>
    </div>
    <a class="btn btn-accent btn-sm" th:href="@{/listings/new}">Post a listing</a>
  </div>

  <p th:if="${listings.items.isEmpty()}" class="empty-state">You haven&apos;t posted any listings yet.</p>

  <div class="row-list" th:unless="${listings.items.isEmpty()}">
    <a class="row-card" th:each="listing : ${listings.items}" th:href="@{'/listings/' + ${listing.id}}">
      <div class="detail-card-header">
        <span class="row-card-title" th:text="${listing.title}">Title</span>
        <span class="badge" th:classappend="'badge-status-' + ${listing.status}" th:text="${listing.statusLabel}">Status</span>
      </div>
      <div class="row-card-footer muted">
        <span th:text="${T(dev.mudbase.showcase.marketplace.support.Formatting).formatCurrency(listing.budget)}">$0</span>
        <span th:text="(${proposalCounts.get(listing.id)} ?: 0) + ' proposal(s)'">0 proposals</span>
        <span th:text="${T(dev.mudbase.showcase.marketplace.support.Formatting).formatRelativeTime(listing.createdAt)}">time</span>
      </div>
    </a>
  </div>

  <nav class="pagination" th:if="${listings.totalPages > 1}">
    <a th:if="${listings.page > 1}" class="btn btn-outline btn-sm" th:href="@{/listings/mine(page=${listings.page - 1})}">Previous</a>
    <span th:unless="${listings.page > 1}" class="btn btn-outline btn-sm btn-disabled">Previous</span>
    <span class="pagination-status" th:text="'Page ' + ${listings.page} + ' of ' + ${listings.totalPages}">Page</span>
    <a th:if="${listings.hasMore}" class="btn btn-outline btn-sm" th:href="@{/listings/mine(page=${listings.page + 1})}">Next</a>
    <span th:unless="${listings.hasMore}" class="btn btn-outline btn-sm btn-disabled">Next</span>
  </nav>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
