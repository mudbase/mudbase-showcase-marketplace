spring.application.name=mudbase-showcase-marketplace-java
server.port=${PORT:8080}

# --- Mudbase project wiring ---------------------------------------------------
# All of these are public identifiers (project id, collection ids), not secrets - see
# .env.example and ../web/plan/build-plan.md. Defaulted here for local dev convenience against
# the already-provisioned showcase project; override via env vars for any other environment.
mudbase.base-url=${MUDBASE_URL:https://cloud.mudbase.dev}
mudbase.project-id=${MUDBASE_PROJECT_ID:6a6d3faad07caabbbdfc56a6}
mudbase.listings-collection-id=${MUDBASE_LISTINGS_COLLECTION_ID:6a6d3fced07caabbbdfc586b}
mudbase.proposals-collection-id=${MUDBASE_PROPOSALS_COLLECTION_ID:6a6d3fcfd07caabbbdfc5896}
mudbase.messages-collection-id=${MUDBASE_MESSAGES_COLLECTION_ID:6a6d3fd0d07caabbbdfc58c5}

# --- Thymeleaf ------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Sessions ---------------------------------------------------------------
server.servlet.session.timeout=30m

logging.level.dev.mudbase.showcase.marketplace=INFO
